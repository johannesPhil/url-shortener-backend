default: &default
  adapter: postgresql
  encoding: unicode
  host: localhost
  username: <%= ENV["DB_USER"] || ENV["USER"] %>
  password: <%= ENV["DB_PASSWORD"] %>
  pool: 5

production:
  primary: &primary_production
    <<: *default
    database: url_shortener_production
  cable:
    <<: *primary_production
  cache:
    <<: *primary_production
  queue:
    <<: *primary_production

development:
  <<: *default
  database: url_shortener_dev

test:
  <<: *default
  database: url_shortener_test

